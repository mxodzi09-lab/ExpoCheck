name: Zbuduj ExpoCheck APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Zachowaj klucz podpisu między wersjami
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: expocheck-debug-keystore-v1

      - name: Test parsera cen
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace --info

      - name: Raport testów parsera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpoCheck-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Zbuduj APK
        run: gradle assembleDebug --stacktrace --info

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpoCheck-v0.5.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
